<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>А. Скрапбук</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&display=swap&subset=cyrillic" rel="stylesheet">
<link rel="stylesheet" href="./ui/base.css">
<style>
  /* А. Скрапбук-коллаж: пробковая доска, вещи на скотче и булавках, наклейки с высечкой, этикетки-«dymo», штамп «пройдено» */
  :root { --ink: #33262e; --paper: #fffaf0; --cream: #fbf5e6; --kraft: #d9bb8f; --sh: rgba(52, 26, 8, .34); --dymo: 'Rubik Mono One', Nunito, sans-serif; }
  #desktop { background:
      var(--grain),
      radial-gradient(circle at 30% 40%, rgba(105, 58, 22, .55) 0 1px, transparent 1.6px) 0 0 / 7px 9px,
      radial-gradient(circle at 70% 20%, rgba(244, 206, 152, .55) 0 1px, transparent 1.8px) 3px 2px / 11px 8px,
      radial-gradient(circle at 50% 50%, rgba(86, 46, 16, .35) 0 1.4px, transparent 2.3px) 5px 6px / 17px 13px,
      radial-gradient(ellipse at 50% 42%, transparent 48%, rgba(58, 28, 8, .42)),
      #c3935c; }

  /* полоска бумаги сверху, обрезанная фигурными ножницами */
  .menubar { height: 46px; padding: 0 22px 6px; background: var(--grain), var(--cream); font: 700 22px Caveat, cursive;
    -webkit-mask: linear-gradient(#000 0 0) top / 100% calc(100% - 6px) no-repeat, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / 12px 6px repeat-x;
            mask: linear-gradient(#000 0 0) top / 100% calc(100% - 6px) no-repeat, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / 12px 6px repeat-x;
    filter: drop-shadow(0 3px 0 var(--sh)); }
  .brand .ic { width: 26px; height: 26px; }
  .dymo, .brand b { font: 13px/1 var(--dymo); letter-spacing: .14em; text-transform: uppercase; color: #fff; padding: 6px 12px 5px; background: #2f3a5a;
    text-shadow: 0 1px 0 rgba(255, 255, 255, .3), 0 -1px 0 rgba(0, 0, 0, .35); box-shadow: 1px 2px 0 var(--sh); border-radius: 2px; rotate: -1.2deg; }
  .m-clock { font-variant-numeric: tabular-nums; }

  /* ярлыки: наклейки + бумажная бирка с подписью; строгая сетка, наклон по очереди */
  .icons { left: 20px; top: 66px; display: grid; grid-template-columns: repeat(2, 96px); gap: 6px 10px; }
  .icon { padding: 4px 0 8px; }
  .icon .ic { width: 58px; height: 58px; transition: transform .16s cubic-bezier(.2, .8, .2, 1.3); }
  .icon .dd { filter: drop-shadow(2px 3px 0 var(--sh)); }
  .icon .lbl { margin-top: -2px; padding: 1px 8px 2px; background: var(--paper); font: 700 18px/1.1 Caveat, cursive; box-shadow: 1px 2px 0 var(--sh); rotate: calc(((var(--i) % 3) - 1) * 2.5deg); }
  .icon:nth-child(odd) .ic { rotate: -4deg; } .icon:nth-child(even) .ic { rotate: 3deg; }
  .icon:hover .ic, .icon:focus-visible .ic { transform: translateY(-5px) scale(1.06); }
  .icon:focus-visible { outline: none; }
  [data-n]::after { top: -2px; right: 12px; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 50%; background: #d8434f; color: #fff; font: 800 13px/24px Nunito, sans-serif; box-shadow: 0 0 0 3px var(--paper), 2px 3px 0 3px var(--sh); }

  /* записка «сколько вместе» на булавке */
  .hello { left: 26px; bottom: 104px; width: 184px; padding: 22px 12px 14px; rotate: 2.5deg; background: var(--grain), #ffe27a; box-shadow: 4px 6px 0 var(--sh); font-family: Caveat, cursive; }
  .hello b { font-size: 64px; line-height: .9; color: #c2405a; }
  .hello span { font-size: 26px; font-weight: 700; }
  .hello small { font: 600 12px Nunito, sans-serif; opacity: .7; margin-top: 4px; }
  .pin { position: absolute; width: 30px; height: 30px; pointer-events: none; z-index: 3; }
  .pin .dd { filter: drop-shadow(2px 3px 0 var(--sh)); }

  /* окна: лист бумаги на двух кусках ленты, заголовок — этикетка dymo цвета приложения, кнопки — головки булавок */
  .win { background: var(--grain), var(--cream); box-shadow: 0 0 0 1px rgba(80, 50, 20, .14), 6px 8px 0 var(--sh); rotate: -.5deg; transition: rotate .2s, box-shadow .2s; }
  .win.active { rotate: .3deg; box-shadow: 0 0 0 1px rgba(80, 50, 20, .14), 9px 12px 0 var(--sh); }
  .win::before, .win::after { content: ''; position: absolute; top: -12px; width: 92px; height: 26px; z-index: 4; pointer-events: none;
    background: repeating-linear-gradient(-45deg, rgba(255, 255, 255, .28) 0 5px, transparent 5px 10px), color-mix(in srgb, var(--c) 70%, transparent);
    -webkit-mask: conic-gradient(from 45deg at left, #0000, #000 1deg 89deg, #0000 90deg) left / 51% 6px repeat-y, conic-gradient(from -135deg at right, #0000, #000 1deg 89deg, #0000 90deg) right / 51% 6px repeat-y;
            mask: conic-gradient(from 45deg at left, #0000, #000 1deg 89deg, #0000 90deg) left / 51% 6px repeat-y, conic-gradient(from -135deg at right, #0000, #000 1deg 89deg, #0000 90deg) right / 51% 6px repeat-y; }
  .win::before { left: -26px; rotate: -32deg; } .win::after { right: -26px; rotate: 28deg; }
  .bar { padding: 16px 18px 8px; }
  .lt { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--ink); font: 900 11px/1 Nunito, sans-serif; box-shadow: inset -2px -2px 0 rgba(0, 0, 0, .14), 1px 2px 0 var(--sh); }
  .lt.r { background: #e0614f; } .lt.y { background: #f2c260; } .lt.g { background: #7fae6a; }
  .win:not(.active) .lt { background: #d9cfbf; }
  .wicon { order: 3; } .wicon .ic { width: 34px; height: 34px; rotate: 8deg; }
  .wicon .dd { filter: drop-shadow(1px 2px 0 var(--sh)); }
  .ttl { flex: none; margin: 0 auto; font: 15px/1 var(--dymo); letter-spacing: .16em; text-transform: uppercase; color: #fff; padding: 8px 16px 7px; background: color-mix(in srgb, var(--c) 82%, #000);
    text-shadow: 0 1px 0 rgba(255, 255, 255, .3), 0 -1px 0 rgba(0, 0, 0, .35); box-shadow: 1px 2px 0 var(--sh); rotate: -1.5deg; }
  .body { padding: 6px 22px 24px; }
  .win.games .body { background: linear-gradient(rgba(63, 163, 154, .16) 1px, transparent 1px) 0 0 / 18px 18px, linear-gradient(90deg, rgba(63, 163, 154, .16) 1px, transparent 1px) 0 0 / 18px 18px; }
  .win.quiz { background: var(--grain), var(--kraft); }

  .btn { border: 2px solid var(--ink); background: var(--paper); border-radius: 8px; padding: 6px 12px; font-weight: 800; font-size: 13px; box-shadow: 0 3px 0 var(--ink); transition: transform .08s, box-shadow .08s; }
  .btn:hover { background: #fff; }
  .btn:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
  .btn.go { background: var(--c, #ef7f9b); color: #fff; text-shadow: 0 1px 0 rgba(0, 0, 0, .25); }

  /* «Игры»: крышки коробок с высечкой */
  .gm-new { gap: 22px 20px; margin: 10px 4px 6px; }
  .gm-card { position: relative; display: grid; grid-template-columns: 70px 1fr; grid-template-rows: auto 1fr auto; column-gap: 12px; padding: 14px 14px 14px 12px;
    background: var(--grain), color-mix(in srgb, var(--c) 22%, var(--paper)); border-radius: 10px; box-shadow: 0 0 0 4px var(--paper), 5px 7px 0 4px var(--sh);
    rotate: -1deg; transition: transform .18s cubic-bezier(.2, .8, .2, 1.3); }
  .gm-card:nth-child(even) { rotate: 1.2deg; }
  .gm-card:hover { transform: translateY(-4px) rotate(-1deg); }
  .gm-card .art { grid-row: 1 / 4; align-self: center; }
  .gm-card .art .ic { width: 70px; height: 70px; }
  .gm-card .art .dd { filter: drop-shadow(2px 3px 0 var(--sh)); }
  .gm-card b { font: 700 28px/1 Caveat, cursive; }
  .gm-card p { margin: 3px 0 10px; font-size: 12.5px; line-height: 1.35; opacity: .8; }
  .gm-card .btn { justify-self: start; }
  .gm-card.slap { animation: slap .42s cubic-bezier(.2, .8, .2, 1.2); }
  @keyframes slap { 0% { transform: scale(1.14) rotate(-5deg); box-shadow: 0 0 0 4px var(--paper), 16px 22px 0 4px rgba(52, 26, 8, .2); } }
  .gm-h { margin: 26px 0 10px; font: 700 30px/1 Caveat, cursive; display: inline-block; padding: 0 6px; background: linear-gradient(transparent 55%, color-mix(in srgb, #f2c260 70%, transparent) 55% 88%, transparent 88%); }
  .gm-list { display: grid; gap: 10px; filter: drop-shadow(3px 4px 0 var(--sh)); }
  /* строки — корешки билетов: вырубка по бокам, перфорация */
  .gm-row { gap: 14px; padding: 8px 18px 8px 16px; background: var(--paper);
    -webkit-mask: radial-gradient(circle 8px at 0 50%, #0000 97%, #000) left / 51% 100% no-repeat, radial-gradient(circle 8px at 100% 50%, #0000 97%, #000) right / 51% 100% no-repeat;
            mask: radial-gradient(circle 8px at 0 50%, #0000 97%, #000) left / 51% 100% no-repeat, radial-gradient(circle 8px at 100% 50%, #0000 97%, #000) right / 51% 100% no-repeat;
    background-image: linear-gradient(90deg, transparent 63px, transparent 63px), repeating-linear-gradient(transparent 0 4px, rgba(51, 38, 46, .35) 4px 7px); background-size: auto, 1.5px 100%; background-position: 0 0, 62px 0; background-repeat: no-repeat; }
  .gm-row > .ic { width: 38px; height: 38px; }
  .gm-row b { font: 700 24px/1 Caveat, cursive; } .gm-row span { font-size: 12.5px; font-weight: 700; opacity: .65; }

  /* «Тесты»: крафт, карточки-учётки на скрепках, вопрос дня — стикер на ленте */
  .qz { padding-top: 6px; }
  .qz-day { margin: 12px 6px 22px; padding: 18px 20px 14px; background: var(--grain), #ffe27a; box-shadow: 5px 7px 0 var(--sh); rotate: -.8deg; }
  .qz-day::before { content: ''; position: absolute; left: 50%; top: -12px; width: 110px; height: 26px; translate: -50%; rotate: 2deg; background: rgba(255, 250, 240, .62); box-shadow: 0 1px 0 rgba(0, 0, 0, .06); }
  .day-head b { font: 15px/1 var(--dymo); letter-spacing: .14em; text-transform: uppercase; }
  .streak { gap: 4px; font: 700 20px Caveat, cursive; }
  .streak i { font-size: 30px; color: #c2405a; }
  .day-q { margin: 8px 0 12px; font: 700 34px/1.05 Caveat, cursive; }
  .day-opts, .day-reveal { gap: 12px; }
  .opt { font-size: 15px; padding: 10px; }
  .ans { padding: 10px 8px 8px; background: var(--paper); box-shadow: 3px 4px 0 var(--sh); animation: flipin .5s cubic-bezier(.2, .8, .2, 1.2) backwards; }
  .ans.she { animation-delay: .35s; rotate: 1.5deg; } .ans.me { rotate: -1.5deg; }
  .ans small { font: 11px var(--dymo); letter-spacing: .12em; text-transform: uppercase; opacity: .6; }
  .ans b { font: 700 26px/1.1 Caveat, cursive; }
  .qz-day.same .ans { box-shadow: 0 0 0 3px #7fae6a, 3px 4px 0 3px var(--sh); }
  @keyframes flipin { from { transform: perspective(500px) rotateY(90deg); opacity: 0; } }
  .day-note { display: block; margin-top: 10px; font-weight: 700; font-size: 12.5px; opacity: .7; }
  .qz-head { gap: 12px; }
  .qz-tabs { gap: 8px; }
  .tab { border: 0; padding: 6px 14px; background: var(--paper); font: 700 21px/1 Caveat, cursive; box-shadow: 2px 3px 0 var(--sh); rotate: -1deg; }
  .tab.on { background: #2f3a5a; color: #fff; rotate: 1deg; }
  .qz-search input { border: 0; border-bottom: 2px dashed var(--ink); background: transparent; padding: 6px 2px; font-weight: 700; }
  .qz-search input::placeholder { color: rgba(51, 38, 46, .6); }
  .qz-chips { gap: 8px; margin: 14px 0 6px; }
  .chip { border: 0; padding: 3px 12px 4px; font-weight: 800; font-size: 12.5px; background: rgba(255, 250, 240, .55); }
  .chip.on, .chip:hover { background: color-mix(in srgb, #ef7f9b 75%, transparent); color: #fff; }
  .qz-wait { position: relative; gap: 10px; margin: 16px 0 6px; padding: 12px 16px 12px 40px; background: var(--grain), var(--paper); box-shadow: 4px 5px 0 var(--sh); rotate: .6deg; }
  .qz-wait b { font: 700 24px/1 Caveat, cursive; }
  .qz-wait .pin { left: 6px; top: 50%; translate: 0 -60%; }
  .qz-grid { gap: 24px 20px; margin-top: 22px; }
  .qz-card { gap: 3px; padding: 18px 12px 14px; background: linear-gradient(transparent 26px, rgba(214, 70, 90, .5) 26px 28px, transparent 28px), repeating-linear-gradient(transparent 0 21px, rgba(90, 140, 200, .22) 21px 22px) 0 8px, #fffdf7;
    box-shadow: 5px 7px 0 var(--sh); rotate: calc(var(--r, -1.2) * 1deg); transition: transform .18s cubic-bezier(.2, .8, .2, 1.3); }
  .qz-card:nth-child(3n+2) { --r: 1; } .qz-card:nth-child(3n) { --r: -.4; }
  .qz-card:hover { transform: translateY(-5px) rotate(1deg); }
  .qz-card .art .ic { width: 66px; height: 66px; }
  .qz-card .art .dd { filter: drop-shadow(2px 3px 0 var(--sh)); }
  .qz-card b { font: 700 25px/1.02 Caveat, cursive; }
  .qz-card small { font-size: 11.5px; opacity: .6; font-weight: 700; }
  .qz-marks { gap: 10px; font-size: 12.5px; font-weight: 800; opacity: .7; } .qz-marks .ok { color: #3c7f4c; opacity: 1; }
  .qz-acts { gap: 6px; justify-content: center; margin-top: 8px; }
  .qz-card .clip { position: absolute; top: -18px; right: 18px; width: 34px; height: 46px; rotate: 8deg; z-index: 2; }
  .stamp { top: 54px; right: 6px; padding: 4px 8px 3px; font: 12px var(--dymo); letter-spacing: .1em; text-transform: uppercase; color: #c2405a; border: 3px double #c2405a; border-radius: 4px; rotate: -14deg; mix-blend-mode: multiply; }
  .qz-card.done .stamp { opacity: .82; }
  .qz-card.stamped .stamp { animation: stamp .36s cubic-bezier(.3, 1.4, .5, 1) both; }
  @keyframes stamp { 0% { opacity: 0; transform: scale(2.4); } 60% { opacity: .9; transform: scale(.94); } }
  .qz-card.stamped { animation: thump .36s .2s; }
  @keyframes thump { 40% { transform: translateY(2px) scale(.985); } }

  /* док — полоса малярной ленты с наклейками */
  .dock { gap: 6px; padding: 8px 26px 6px; background: var(--grain), rgba(239, 226, 194, .9); box-shadow: 0 3px 0 var(--sh);
    -webkit-mask: conic-gradient(from 45deg at left, #0000, #000 1deg 89deg, #0000 90deg) left / 51% 8px repeat-y, conic-gradient(from -135deg at right, #0000, #000 1deg 89deg, #0000 90deg) right / 51% 8px repeat-y;
            mask: conic-gradient(from 45deg at left, #0000, #000 1deg 89deg, #0000 90deg) left / 51% 8px repeat-y, conic-gradient(from -135deg at right, #0000, #000 1deg 89deg, #0000 90deg) right / 51% 8px repeat-y; }
  .dock button { width: 50px; height: 50px; }
  .dock button .ic { width: 48px; height: 48px; }
  .dock .power { margin-left: 8px; }
  .dock button.run::before { content: ''; position: absolute; left: 50%; bottom: -5px; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--ink); }
  .dock [data-n]::after { top: -4px; right: -4px; transform: scale(.8); }
</style>
</head>
<body>
<div id="desktop"></div>
<script type="module">
  import { build } from './ui/proto.js';
  import { doodle } from '../doodles.js';
  build({
    style: 'sticker',
    colors: { tube: '#e0614f', gallery: '#6fa8d6', plans: '#7fae6a', thoughts: '#a58bd1', counter: '#ef7f9b', quiz: '#e9a92f', games: '#3fa39a', shop: '#f08b46', profile: '#4b6fb5', power: '#f2c260',
      g_wave: '#6fa8d6', g_draw: '#e0614f', g_ttt: '#ef7f9b', g_cats: '#f08b46', t_chaos: '#a58bd1', t_cats: '#f08b46', t_bowl: '#3fa39a', t_cake: '#ef7f9b', t_love: '#e0614f', t_cloud: '#6fa8d6', day: '#f08b46' },
    decorate(root, { h }) {
      const pin = (accent) => h('span', { cls: 'pin', html: doodle('pin', { style: 'sticker', accent }) });
      const hello = root.querySelector('.hello'); const p = pin('#e0614f'); p.style.cssText = 'left:50%;top:-12px;translate:-50%'; hello.append(p);
      root.querySelector('.qz-wait').prepend(pin('#4b6fb5'));
      root.querySelectorAll('.qz-card').forEach((c, i) => { if (i % 3 === 0) c.append(h('span', { cls: 'clip', html: doodle('clip', { style: 'sticker' }) })); });
    },
  });
</script>
</body>
</html>
