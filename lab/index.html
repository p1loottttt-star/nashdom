<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Лаборатория стилей</title>
<style>
  html, body { margin: 0; height: 100%; background: #1d1520; overflow: hidden; font: 14px system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; left: 12px; top: 12px; display: flex; gap: 6px; align-items: center; color: #fff; }
  #hud a { padding: 6px 12px; border-radius: 999px; background: rgba(0,0,0,.45); color: #fff; text-decoration: none; }
  #hud a.on { background: #f08aa0; }
  #ms { padding: 6px 10px; border-radius: 8px; background: rgba(0,0,0,.45); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <a href="?v=cartoon">мультяшный</a><a href="?v=real">реалистичный</a><a href="?v=soft">мягкий</a>
  <span id="ms"></span>
</div>
<script type="module" src="./lab.js"></script>
</body>
</html>
