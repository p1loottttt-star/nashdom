<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Наш дом</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♥</text></svg>">
<style>
  :root {
    --ink: #3b2a35; --paper: #fffaf2; --rose: #f08aa0; --peach: #ffc9a8;
    --glass: rgba(255, 250, 245, .82); --line: rgba(59, 42, 53, .12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a1f2d; color: var(--ink); font-family: Nunito, system-ui, sans-serif; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #scene { touch-action: none; }
  body.hover #scene { cursor: pointer; }
  body.aim #scene { cursor: grab; }
  body.drag #scene { cursor: grabbing; }
  body.aim .hud { opacity: 0; pointer-events: none; }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* ---- подсказки в комнате ---- */
  .hud { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; gap: 10px; transition: opacity .4s; }
  .hud button, .pill { white-space: nowrap; border: 0; border-radius: 999px; padding: 11px 18px; background: var(--glass); backdrop-filter: blur(10px); box-shadow: 0 6px 24px rgba(0,0,0,.25); font-weight: 700; }
  .tip { position: fixed; left: 50%; bottom: 78px; transform: translateX(-50%); font-family: Caveat, cursive; font-size: 26px; color: #ffe7d6; text-shadow: 0 2px 12px rgba(0,0,0,.5); pointer-events: none; transition: opacity .4s; white-space: nowrap; }
  body.busy .hud, body.busy .tip { opacity: 0; pointer-events: none; }
  /* режим «расставить»: внизу коробка с вещами, подсказки комнаты прячем */
  body.editing .hud, body.editing .tip { opacity: 0; pointer-events: none; }
  body.placing, body.placing * { cursor: grabbing !important; }
  .tray { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 40; width: min(980px, calc(100vw - 24px)); padding: 10px 12px 12px;
    background: var(--paper); border: 2px solid var(--ink); border-radius: 18px 6px 16px 8px / 8px 16px 6px 18px; box-shadow: 5px 6px 0 rgba(59,42,53,.18); }
  .tray[hidden] { display: none; }
  .tray.drop { background: #ffe6ec; }
  body.placing .tray-list, body.placing .tray-head button { display: none; } /* тащим вещь — коробка сворачивается, пол виден */
  body.placing .tray-hint::after { content: ' · сюда — убрать'; }
  .tray-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .tray-head b { font: 700 26px/1 Caveat, cursive; }
  .tray-hint { font-size: 13px; opacity: .6; }
  .tray-head button { border: 2px solid var(--ink); background: #fff; border-radius: 52% 46% 55% 44% / 47% 55% 45% 53%; min-width: 38px; height: 34px; cursor: pointer; font-weight: 800; }
  .tray-head .done { padding: 0 16px; border-radius: 6px 14px 5px 12px / 12px 5px 14px 6px; background: var(--rose); color: #fff; font: 700 20px Caveat, cursive; }
  .tray-list { display: flex; gap: 8px; overflow-x: auto; padding-top: 10px; min-height: 64px; }
  .tray-item { flex: none; display: grid; justify-items: center; gap: 2px; width: 88px; padding: 6px 4px; cursor: grab; background: #fff; color: var(--ink);
    border: 1.5px solid var(--ink); border-radius: 10px 4px 12px 5px / 5px 12px 4px 10px; font: inherit; touch-action: none; user-select: none; }
  .tray-item:hover { transform: rotate(-2deg); background: #ffe6ec; }
  .tray-item i { font-style: normal; font-size: 26px; }
  .tray-item span { font-size: 11px; line-height: 1.15; text-align: center; }
  .tray-empty { margin: 8px 4px; opacity: .65; }
  .rsetup { position: fixed; right: 18px; top: 18px; z-index: 45; width: min(330px, calc(100vw - 36px)); padding: 16px 18px; display: grid; gap: 8px;
    background: var(--paper); border: 2px solid var(--ink); border-radius: 18px 6px 16px 8px / 8px 16px 6px 18px; box-shadow: 5px 6px 0 rgba(59,42,53,.18); }
  .rsetup h3 { margin: 0; font: 700 32px/1 Caveat, cursive; }
  .rsetup p { margin: 0 0 4px; font-size: 14px; opacity: .75; }
  .rs-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .rs-sw { width: 34px; height: 34px; cursor: pointer; border: 2px solid rgba(59,42,53,.35); border-radius: 52% 46% 55% 44% / 47% 55% 45% 53%; }
  .rs-sw.on { border-color: var(--ink); box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--ink); }
  .rs-done { margin-top: 6px; border: 2px solid var(--ink); background: var(--rose); color: #fff; font: 700 22px Caveat, cursive; padding: 6px; border-radius: 6px 14px 5px 12px / 12px 5px 14px 6px; cursor: pointer; }
  .float { position: fixed; pointer-events: none; font-size: 26px; animation: up 1.4s ease-out forwards; }
  @keyframes up { to { transform: translateY(-90px) scale(1.4); opacity: 0; } }

  /* ---- окно «написать записку» ---- */
  .modal { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(20, 12, 18, .45); }
  .modal[hidden] { display: none; }
  .modal form { width: min(420px, calc(100vw - 24px)); max-height: calc(100vh - 24px); overflow: auto; background: var(--paper); border-radius: 18px; padding: 16px 18px; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
  .modal h3 { margin: 0 0 8px; font-family: Caveat, cursive; font-size: 30px; }
  .pad { --u: .45px; position: relative; width: min(100%, calc((100vh - 230px) * .75)); margin: 0 auto; aspect-ratio: 3 / 4; border-radius: 4px; overflow: hidden; box-shadow: 0 6px 18px rgba(0,0,0,.15); }
  .pad canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .pad textarea { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; outline: 0; resize: none; background: transparent; color: #2b3a67;
    font: 700 calc(58 * var(--u)) / calc(60 * var(--u)) Caveat, cursive; padding: calc(115 * var(--u)) calc(54 * var(--u)) 0 calc(116 * var(--u)); overflow: hidden; }
  .pad[data-mode=text] canvas.ink { pointer-events: none; }
  .pad[data-mode=draw] textarea { pointer-events: none; }
  .pad[data-mode=draw] canvas.ink { cursor: crosshair; touch-action: none; }
  .tools { display: flex; gap: 6px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .tools button { border: 1px solid var(--line); background: #fff; border-radius: 9px; padding: 6px 10px; font-weight: 700; }
  .tools button.on { background: var(--ink); color: #fff; }
  .tools .c { width: 26px; height: 26px; padding: 0; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line); }
  .tools .c.on { box-shadow: 0 0 0 2px var(--ink); }
  .modal .row { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
  .modal select { font: inherit; padding: 8px; border-radius: 8px; border: 1px solid var(--line); }
  .modal .row button { margin-left: auto; border: 0; border-radius: 10px; padding: 10px 16px; background: var(--rose); color: #fff; font-weight: 800; }

  /* ---- рабочий стол на экране ноутбука: скрапбук (10.10, lab/ui-a.html) ----
     вещи на ленте и булавках, наклейки с высечкой, этикетки-dymo, жёсткие тени без размытия, зерно — тайл из desktop.js */
  #desktop { --sh: rgba(52,26,8,.34); --cream: #fbf5e6; --kraft: #d9bb8f; --dymo: 'Rubik Mono One', Nunito, sans-serif;
    position: fixed; inset: 0; overflow: hidden; opacity: 0; transition: opacity .5s; background: var(--grain), #cfc7b8; }
  #desktop[data-wall=linen] { background: var(--grain), repeating-linear-gradient(0deg, rgba(255,255,255,.08) 0 1px, transparent 1px 3px), repeating-linear-gradient(90deg, rgba(60,40,20,.06) 0 1px, transparent 1px 4px), radial-gradient(ellipse at 50% 42%, transparent 50%, rgba(50,35,20,.28)), #cbc3b3; }
  #desktop[data-wall=slate] { background: var(--grain), radial-gradient(ellipse at 50% 42%, transparent 45%, rgba(0,0,0,.4)), #4b5058; }
  #desktop[data-wall=sage] { background: var(--grain), var(--grain) 80px 50px, radial-gradient(ellipse at 50% 42%, transparent 45%, rgba(30,45,30,.35)), #98a993; }
  #desktop[data-wall=blush] { background: var(--grain), radial-gradient(ellipse at 50% 42%, transparent 50%, rgba(90,40,40,.22)), #e6cfc5; }
  #desktop[data-wall=cork] { background: var(--grain), radial-gradient(circle at 30% 40%, rgba(105,58,22,.55) 0 1px, transparent 1.6px) 0 0 / 7px 9px,
    radial-gradient(circle at 70% 20%, rgba(244,206,152,.55) 0 1px, transparent 1.8px) 3px 2px / 11px 8px, radial-gradient(circle at 50% 50%, rgba(86,46,16,.35) 0 1.4px, transparent 2.3px) 5px 6px / 17px 13px,
    radial-gradient(ellipse at 50% 42%, transparent 48%, rgba(58,28,8,.42)), #c3935c; }
  #desktop[data-wall=photo] { background: var(--grain), var(--photo) center / cover no-repeat, #cbc3b3; }
  #desktop.on { opacity: 1; }
  #desktop[hidden] { display: none; }
  /* полоса бумаги сверху, обрезанная фигурными ножницами */
  .menubar { position: relative; z-index: 2; height: 46px; display: flex; align-items: center; gap: 18px; padding: 0 22px 6px; background: var(--grain), var(--cream); font: 700 22px Caveat, cursive;
    -webkit-mask: linear-gradient(#000 0 0) top / 100% calc(100% - 6px) no-repeat, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / 12px 6px repeat-x;
            mask: linear-gradient(#000 0 0) top / 100% calc(100% - 6px) no-repeat, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / 12px 6px repeat-x;
    filter: drop-shadow(0 3px 0 var(--sh)); }
  .menubar .grow { flex: 1; }
  .menubar .brand { display: flex; align-items: center; gap: 8px; }
  .menubar .brand i { width: 26px; height: 26px; }
  .dymo { font: 13px/1 var(--dymo); letter-spacing: .14em; text-transform: uppercase; color: #fff; padding: 6px 12px 5px; background: #2f3a5a; border-radius: 2px;
    text-shadow: 0 1px 0 rgba(255,255,255,.3), 0 -1px 0 rgba(0,0,0,.35); box-shadow: 1px 2px 0 var(--sh); rotate: -1.2deg; }
  #mClock { font-variant-numeric: tabular-nums; }
  #wallBtn { display: flex; align-items: center; gap: 4px; border: 0; background: none; padding: 0 4px; font: 700 20px Caveat, cursive; }
  #wallBtn i { width: 26px; height: 26px; transition: transform .15s; } #wallBtn:hover i { transform: rotate(-12deg) scale(1.1); }
  #desktop i:has(> .dd) { display: grid; place-items: center; line-height: 0; font-style: normal; }
  #desktop .dd { width: 100%; height: 100%; overflow: visible; }
  /* записка «сколько вместе» на булавке */
  .hello { position: absolute; left: 28px; bottom: 112px; width: 190px; display: grid; justify-items: center; padding: 22px 12px 14px; rotate: 2.5deg; pointer-events: none;
    background: var(--grain), #ffe27a; box-shadow: 4px 6px 0 var(--sh); font-family: Caveat, cursive; text-align: center; }
  .hello::before { content: ''; position: absolute; left: 50%; top: -9px; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%; background: #e0614f; border: 1.5px solid var(--ink); box-shadow: inset -3px -3px 0 rgba(0,0,0,.15), 2px 3px 0 var(--sh); }
  .hello b { font-size: 64px; line-height: .9; color: #c2405a; font-weight: 700; }
  .hello span { font-size: 26px; font-weight: 700; }
  .hello small { font: 600 12px Nunito, sans-serif; opacity: .7; margin-top: 4px; }
  /* ярлыки: наклейки + бумажная бирка; строгая сетка, наклон по очереди */
  .icons { position: absolute; top: 64px; left: 20px; display: grid; grid-template-columns: repeat(2, 96px); gap: 6px 10px; }
  .icon { position: relative; display: grid; justify-items: center; padding: 4px 0 8px; border: 0; background: none; }
  .icon i { width: 58px; height: 58px; transition: transform .16s cubic-bezier(.2,.8,.2,1.3); }
  .icon .dd { filter: drop-shadow(2px 3px 0 var(--sh)); }
  .icon:nth-child(odd) i { rotate: -4deg; } .icon:nth-child(even) i { rotate: 3deg; }
  .icon .lbl { margin-top: -2px; padding: 1px 8px 2px; background: #fffaf0; font: 700 18px/1.1 Caveat, cursive; box-shadow: 1px 2px 0 var(--sh); white-space: nowrap; }
  .icon:nth-child(3n) .lbl { rotate: -2.5deg; } .icon:nth-child(3n+1) .lbl { rotate: 1.5deg; }
  .icon:hover i, .icon:focus-visible i { transform: translateY(-5px) scale(1.06); }
  .icon:focus-visible { outline: none; } .icon:focus-visible .lbl { box-shadow: 0 0 0 2px var(--ink), 1px 2px 0 2px var(--sh); }
  /* обои: выбор */
  .wallpick { position: absolute; z-index: 100001; top: 52px; right: 150px; width: 300px; padding: 16px 16px 14px; background: var(--grain), #fffaf0; box-shadow: 0 0 0 1px rgba(80,50,20,.14), 6px 8px 0 var(--sh); rotate: .6deg; animation: pop .2s ease-out; }
  .wallpick b { font: 14px var(--dymo); letter-spacing: .12em; text-transform: uppercase; }
  .wp-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 12px 0; }
  .wp { display: grid; justify-items: center; gap: 4px; border: 0; background: none; padding: 0; font: 700 15px/1 Caveat, cursive; }
  .wp i { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--ink); box-shadow: 2px 3px 0 var(--sh); transition: transform .12s; }
  .wp i[data-wall] { background: #cbc3b3; } .wp i[data-wall=slate] { background: #4b5058; } .wp i[data-wall=sage] { background: #98a993; } .wp i[data-wall=blush] { background: #e6cfc5; }
  .wp i[data-wall=cork] { background: radial-gradient(circle, rgba(105,58,22,.6) 0 1px, transparent 1.6px) 0 0 / 6px 6px, #c3935c; }
  .wp:hover i { transform: translateY(-2px); } .wp.on i { box-shadow: 0 0 0 3px #fffaf0, 0 0 0 5px #e0614f; }
  .wp-photo { width: 100%; border: 2px dashed var(--ink); background: none; padding: 8px; font: 700 20px Caveat, cursive; }
  /* док — полоса малярной ленты с наклейками */
  .dock { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 100000; display: flex; align-items: flex-end; gap: 2px; padding: 8px 26px 6px; contain: layout style;
    background: var(--grain), rgba(239,226,194,.94); filter: drop-shadow(0 3px 0 var(--sh));
    -webkit-mask: conic-gradient(from 45deg at left, #0000, #000 1deg 89deg, #0000 90deg) left / 51% 8px repeat-y, conic-gradient(from -135deg at right, #0000, #000 1deg 89deg, #0000 90deg) right / 51% 8px repeat-y;
            mask: conic-gradient(from 45deg at left, #0000, #000 1deg 89deg, #0000 90deg) left / 51% 8px repeat-y, conic-gradient(from -135deg at right, #0000, #000 1deg 89deg, #0000 90deg) right / 51% 8px repeat-y; }
  .dock button { position: relative; width: 52px; height: 52px; padding: 0; border: 0; background: none; cursor: pointer; transition: width .12s ease-out; }
  .dock button i { width: 50px; height: 50px; margin: 1px auto 0; transform: scale(var(--k, 1)); transform-origin: 50% 100%; transition: transform .12s ease-out; }
  .dock button.run::before { content: ''; position: absolute; left: 50%; bottom: -5px; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--ink); }
  .dock #power { margin-left: 8px; }

  /* окна: лист бумаги на двух кусках ленты цвета приложения, заголовок — этикетка dymo, кнопки — головки булавок. Положение — transform (winman.js) */
  .win { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; background: var(--grain), var(--cream); color: var(--ink);
    box-shadow: 0 0 0 1px rgba(80,50,20,.14), 5px 7px 0 var(--sh); contain: layout style; }
  .win.active { box-shadow: 0 0 0 1px rgba(80,50,20,.14), 9px 12px 0 var(--sh); }
  .win.lift { rotate: .6deg; will-change: transform; box-shadow: 0 0 0 1px rgba(80,50,20,.14), 14px 19px 0 rgba(52,26,8,.26); }
  .win[hidden] { display: none; }
  .win::before, .win::after { content: ''; position: absolute; top: -12px; width: 92px; height: 26px; z-index: 4; pointer-events: none;
    background: repeating-linear-gradient(-45deg, rgba(255,255,255,.28) 0 5px, transparent 5px 10px), color-mix(in srgb, var(--c, #ef7f9b) 72%, transparent);
    -webkit-mask: conic-gradient(from 45deg at left, #0000, #000 1deg 89deg, #0000 90deg) left / 51% 6px repeat-y, conic-gradient(from -135deg at right, #0000, #000 1deg 89deg, #0000 90deg) right / 51% 6px repeat-y;
            mask: conic-gradient(from 45deg at left, #0000, #000 1deg 89deg, #0000 90deg) left / 51% 6px repeat-y, conic-gradient(from -135deg at right, #0000, #000 1deg 89deg, #0000 90deg) right / 51% 6px repeat-y; }
  .win::before { left: -26px; rotate: -32deg; } .win::after { right: -26px; rotate: 28deg; }
  .win.maxed::before, .win.maxed::after { display: none; }
  .bar { position: relative; display: flex; align-items: center; gap: 10px; padding: 12px 16px 8px; cursor: grab; user-select: none; touch-action: none; flex: none; }
  .win.lift .bar { cursor: grabbing; }
  .bar .ttl { margin: 0 auto; max-width: calc(100% - 150px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font: 14px/1 var(--dymo); letter-spacing: .15em; text-transform: uppercase; color: #fff;
    padding: 8px 15px 7px; background: color-mix(in srgb, var(--c, #ef7f9b) 80%, #000); text-shadow: 0 1px 0 rgba(255,255,255,.3), 0 -1px 0 rgba(0,0,0,.35); box-shadow: 1px 2px 0 var(--sh); rotate: -1.5deg; }
  .win:not(.active) .bar .ttl { filter: saturate(.5); }
  .wicon { width: 34px; height: 34px; rotate: 8deg; flex: none; } .wicon .dd { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(1px 2px 0 var(--sh)); }
  .lights { display: flex; gap: 8px; padding: 4px 0; width: 66px; }
  .lt { width: 16px; height: 16px; padding: 0; border: 1.5px solid var(--ink); border-radius: 50%; cursor: pointer; font: 900 11px/1 Nunito, sans-serif; color: transparent; display: grid; place-items: center;
    box-shadow: inset -2px -2px 0 rgba(0,0,0,.14), 1px 2px 0 var(--sh); transition: color .1s ease-in; }
  .lt.r { background: #e0614f; } .lt.y { background: #f2c260; } .lt.g { background: #7fae6a; }
  .win:not(.active) .lt { background: #d9cfbf; }
  .lights:hover .lt { color: var(--ink); }
  .win:not(.active) .lights:hover .lt.r { background: #e0614f; } .win:not(.active) .lights:hover .lt.y { background: #f2c260; } .win:not(.active) .lights:hover .lt.g { background: #7fae6a; }
  .rz { position: absolute; z-index: 3; }
  .rz-n, .rz-s { left: 12px; right: 12px; height: 8px; cursor: ns-resize; } .rz-n { top: -5px; } .rz-s { bottom: -5px; }
  .rz-e, .rz-w { top: 12px; bottom: 12px; width: 8px; cursor: ew-resize; } .rz-e { right: -5px; } .rz-w { left: -5px; }
  .rz-ne, .rz-nw, .rz-se, .rz-sw { width: 16px; height: 16px; } .rz-ne { top: -6px; right: -6px; cursor: nesw-resize; } .rz-sw { bottom: -6px; left: -6px; cursor: nesw-resize; }
  .rz-nw { top: -6px; left: -6px; cursor: nwse-resize; } .rz-se { bottom: -6px; right: -6px; cursor: nwse-resize; }
  .win.maxed .rz { display: none; }
  #desktop.gesturing { user-select: none; } #desktop.gesturing iframe, #desktop.gesturing video { pointer-events: none; }
  .snapbox { position: absolute; left: 0; top: 0; pointer-events: none; border: 2.5px dashed var(--ink); background: rgba(255,250,240,.35); }
  .body { flex: 1; min-height: 0; padding: 16px; overflow: auto; container-type: size; }
  .win.app-games .body { background: linear-gradient(rgba(63,163,154,.15) 1px, transparent 1px) 0 0 / 18px 18px, linear-gradient(90deg, rgba(63,163,154,.15) 1px, transparent 1px) 0 0 / 18px 18px; }
  .win.app-quiz { background: var(--grain), var(--kraft); }
  /* значок «ждёт тебя» — красная наклейка-кружок */
  #desktop [data-app][data-n]::after { content: attr(data-n); position: absolute; z-index: 2; top: -2px; right: 12px; min-width: 24px; height: 24px; padding: 0 6px; box-sizing: border-box; border-radius: 50%; background: #d8434f; color: #fff;
    font: 800 13px/24px Nunito, sans-serif; text-align: center; border: 0; box-shadow: 0 0 0 3px #fffaf0, 2px 3px 0 3px var(--sh); }
  #desktop .dock [data-app][data-n]::after { top: -4px; right: -2px; transform: scale(.8); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  .polaroid { background: #fff; padding: 8px 8px 30px; box-shadow: 0 6px 16px rgba(0,0,0,.12); transform: rotate(var(--r)); position: relative; }
  .polaroid img, .polaroid .ph { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: linear-gradient(135deg, #fde2d4, #f6c1d0); }
  .polaroid span { position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; font-family: Caveat, cursive; font-size: 20px; }
  .empty { font-family: Caveat, cursive; font-size: 22px; opacity: .7; }

  .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .list label { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; background: rgba(255,255,255,.6); }
  .list input:checked + span { text-decoration: line-through; opacity: .5; }
  .add { display: flex; gap: 8px; margin-top: 12px; }
  .add input, .add textarea { flex: 1; font: inherit; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: #fff; }
  .add button { border: 0; border-radius: 10px; padding: 0 16px; background: var(--rose); color: #fff; font-weight: 800; }

<canvas id="scene"></canvas>

<div class="tip" id="tip">нажми на ноутбук, записки или котика</div>
<div class="hud"><button id="wx" title="погода в твоём городе">📍 твой город</button><button id="write">✎ написать записку</button><button id="arrange" title="двигать вещи в комнате">🪄 расставить</button><button id="mute" aria-label="Звук"></button></div>

<div class="modal" id="modal" hidden>
  <form id="noteForm">
    <h3>Записка</h3>
    <div class="pad" data-mode="text">
      <canvas></canvas>
      <textarea name="text" maxlength="400" spellcheck="false" placeholder="напиши что-нибудь милое…"></textarea>
      <canvas class="ink"></canvas>
    </div>
    <div class="tools">
      <button type="button" data-mode="text">✎ текст</button>
      <button type="button" data-mode="draw">✏ рисовать</button>
      <button type="button" class="c on" data-color="#4a4a55" style="background:#4a4a55" title="карандаш"></button>
      <button type="button" class="c" data-color="#d0506a" style="background:#d0506a" title="красный"></button>
      <button type="button" class="c" data-color="#3f5fae" style="background:#3f5fae" title="синий"></button>
      <button type="button" data-undo title="отменить">↶</button>
      <button type="button" data-clear title="стереть рисунок">🗑</button>
    </div>
    <div class="row">
      <span>от</span><select name="from" id="fromSel"></select>
      <button>скомкать и бросить</button>
    </div>
  </form>
</div>

<div class="booklabel" id="booklabel" hidden></div>

<button id="trashBtn" hidden title="скомкать и выбросить в мусорку">🗑 в мусорку</button>
<div id="noteNav" hidden><button class="prev" aria-label="Предыдущая">‹</button><span></span><button class="next" aria-label="Следующая">›</button></div>

<div id="gate" hidden></div>

<div id="wallModal" hidden>
  <div class="wbox">
    <h3>Фото на стене</h3>
    <div class="ph"><img alt="" hidden><div class="empty">пока пусто</div></div>
    <input name="caption" maxlength="40" placeholder="подпись на полароиде…">
    <span class="status"></span>
    <label class="ghost">выбрать фото<input type="file" name="file" accept="image/*"></label>
    <button data-a="save">повесить</button>
    <div><button class="ghost" data-a="remove">снять</button> <button class="ghost" data-a="close">закрыть</button></div>
  </div>
</div>

<div id="album" hidden>
  <div class="album-top">
    <button data-a="close">← в комнату</button>
    <span class="album-name"></span>
    <button data-a="edit">✎ редактировать</button>
  </div>
  <div class="album-tools" hidden>
    <input name="title" maxlength="40" aria-label="Название альбома">
    <span class="swatches"></span><input type="color" name="color" aria-label="Свой цвет">
    <label>🖼 фото на обложку<input type="file" name="cover" accept="image/*"></label>
    <label>＋ фото<input type="file" name="photos" accept="image/*" multiple></label>
    <button type="button" data-a="text">＋ подпись</button>
    <button type="button" data-a="page">＋ страница</button>
    <button type="button" data-a="unpage">− страница</button>
    <button type="button" data-a="delete" class="danger">удалить альбом</button>
  </div>
  <div class="spread"></div>
  <div class="album-nav"><button data-a="prev">‹</button><span class="album-pos"></span><button data-a="next">›</button></div>
</div>

<div id="desktop" hidden>
  <div class="menubar">
    <span class="brand"><i></i><b class="dymo">Наш дом</b></span><span class="grow"></span>
    <button id="wallBtn" title="Обои"><i></i>обои</button><span id="mDays"></span><span id="mClock"></span>
  </div>
  <div class="hello"><b id="hello"></b><span id="helloTxt"></span><small id="helloNext"></small></div>
  <div class="icons">
    <button class="icon" data-app="tube"><i></i><span class="lbl">CoupleTube</span></button>
    <button class="icon" data-app="gallery"><i></i><span class="lbl">Галерея</span></button>
    <button class="icon" data-app="plans"><i></i><span class="lbl">Планы</span></button>
    <button class="icon" data-app="thoughts"><i></i><span class="lbl">Мысли</span></button>
    <button class="icon" data-app="counter"><i></i><span class="lbl">Мы вместе</span></button>
    <button class="icon" data-app="quiz"><i></i><span class="lbl">Тесты</span></button>
    <button class="icon" data-app="games"><i></i><span class="lbl">Игры</span></button>
    <button class="icon" data-app="shop"><i></i><span class="lbl">Магазин</span></button>
    <button class="icon" data-app="profile"><i></i><span class="lbl">Профиль</span></button>
  </div>
  <div class="dock">
    <button data-app="tube" title="CoupleTube"><i></i></button>
    <button data-app="gallery" title="Галерея"><i></i></button>
    <button data-app="plans" title="Планы"><i></i></button>
    <button data-app="thoughts" title="Мысли"><i></i></button>
    <button data-app="counter" title="Мы вместе"><i></i></button>
    <button data-app="quiz" title="Тесты"><i></i></button>
    <button data-app="games" title="Игры"><i></i></button>
    <button data-app="shop" title="Магазин"><i></i></button>
    <button data-app="profile" title="Профиль"><i></i></button>
    <button id="power" title="Назад в комнату"><i></i></button>
  </div>
</div>

<script type="module" src="/room.js"></script>
</body>
</html>
