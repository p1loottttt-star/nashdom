<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Наш дом</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♥</text></svg>">
<style>
  :root {
    --ink: #3b2a35; --paper: #fffaf2; --rose: #f08aa0; --peach: #ffc9a8;
    --glass: rgba(255, 250, 245, .82); --line: rgba(59, 42, 53, .12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a1f2d; color: var(--ink); font-family: Nunito, system-ui, sans-serif; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #scene { touch-action: none; }
  body.hover #scene { cursor: pointer; }
  body.aim #scene { cursor: grab; }
  body.drag #scene { cursor: grabbing; }
  body.aim .hud { opacity: 0; pointer-events: none; }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* ---- подсказки в комнате ---- */
  .hud { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; gap: 10px; transition: opacity .4s; }
  .hud button, .pill { white-space: nowrap; border: 0; border-radius: 999px; padding: 11px 18px; background: var(--glass); backdrop-filter: blur(10px); box-shadow: 0 6px 24px rgba(0,0,0,.25); font-weight: 700; }
  .tip { position: fixed; left: 50%; bottom: 78px; transform: translateX(-50%); font-family: Caveat, cursive; font-size: 26px; color: #ffe7d6; text-shadow: 0 2px 12px rgba(0,0,0,.5); pointer-events: none; transition: opacity .4s; white-space: nowrap; }
  body.busy .hud, body.busy .tip { opacity: 0; pointer-events: none; }
  /* режим «расставить»: внизу коробка с вещами, подсказки комнаты прячем */
  body.editing .hud, body.editing .tip { opacity: 0; pointer-events: none; }
  body.placing, body.placing * { cursor: grabbing !important; }
  .tray { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 40; width: min(980px, calc(100vw - 24px)); padding: 10px 12px 12px;
    background: var(--paper); border: 2px solid var(--ink); border-radius: 18px 6px 16px 8px / 8px 16px 6px 18px; box-shadow: 5px 6px 0 rgba(59,42,53,.18); }
  .tray[hidden] { display: none; }
  .tray.drop { background: #ffe6ec; }
  body.placing .tray-list, body.placing .tray-head button { display: none; } /* тащим вещь — коробка сворачивается, пол виден */
  body.placing .tray-hint::after { content: ' · сюда — убрать'; }
  .tray-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .tray-head b { font: 700 26px/1 Caveat, cursive; }
  .tray-hint { font-size: 13px; opacity: .6; }
  .tray-head button { border: 2px solid var(--ink); background: #fff; border-radius: 52% 46% 55% 44% / 47% 55% 45% 53%; min-width: 38px; height: 34px; cursor: pointer; font-weight: 800; }
  .tray-head .done { padding: 0 16px; border-radius: 6px 14px 5px 12px / 12px 5px 14px 6px; background: var(--rose); color: #fff; font: 700 20px Caveat, cursive; }
  .tray-list { display: flex; gap: 8px; overflow-x: auto; padding-top: 10px; min-height: 64px; }
  .tray-item { flex: none; display: grid; justify-items: center; gap: 2px; width: 88px; padding: 6px 4px; cursor: grab; background: #fff; color: var(--ink);
    border: 1.5px solid var(--ink); border-radius: 10px 4px 12px 5px / 5px 12px 4px 10px; font: inherit; touch-action: none; user-select: none; }
  .tray-item:hover { transform: rotate(-2deg); background: #ffe6ec; }
  .tray-item i { font-style: normal; font-size: 26px; }
  .tray-item span { font-size: 11px; line-height: 1.15; text-align: center; }
  .tray-empty { margin: 8px 4px; opacity: .65; }
  .rsetup { position: fixed; right: 18px; top: 18px; z-index: 45; width: min(330px, calc(100vw - 36px)); padding: 16px 18px; display: grid; gap: 8px;
    background: var(--paper); border: 2px solid var(--ink); border-radius: 18px 6px 16px 8px / 8px 16px 6px 18px; box-shadow: 5px 6px 0 rgba(59,42,53,.18); }
  .rsetup h3 { margin: 0; font: 700 32px/1 Caveat, cursive; }
  .rsetup p { margin: 0 0 4px; font-size: 14px; opacity: .75; }
  .rs-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .rs-sw { width: 34px; height: 34px; cursor: pointer; border: 2px solid rgba(59,42,53,.35); border-radius: 52% 46% 55% 44% / 47% 55% 45% 53%; }
  .rs-sw.on { border-color: var(--ink); box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--ink); }
  .rs-done { margin-top: 6px; border: 2px solid var(--ink); background: var(--rose); color: #fff; font: 700 22px Caveat, cursive; padding: 6px; border-radius: 6px 14px 5px 12px / 12px 5px 14px 6px; cursor: pointer; }
  .float { position: fixed; pointer-events: none; font-size: 26px; animation: up 1.4s ease-out forwards; }
  @keyframes up { to { transform: translateY(-90px) scale(1.4); opacity: 0; } }

  /* ---- окно «написать записку» ---- */
  .modal { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(20, 12, 18, .45); }
  .modal[hidden] { display: none; }
  .modal form { width: min(420px, calc(100vw - 24px)); max-height: calc(100vh - 24px); overflow: auto; background: var(--paper); border-radius: 18px; padding: 16px 18px; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
  .modal h3 { margin: 0 0 8px; font-family: Caveat, cursive; font-size: 30px; }
  .pad { --u: .45px; position: relative; width: min(100%, calc((100vh - 230px) * .75)); margin: 0 auto; aspect-ratio: 3 / 4; border-radius: 4px; overflow: hidden; box-shadow: 0 6px 18px rgba(0,0,0,.15); }
  .pad canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .pad textarea { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; outline: 0; resize: none; background: transparent; color: #2b3a67;
    font: 700 calc(58 * var(--u)) / calc(60 * var(--u)) Caveat, cursive; padding: calc(115 * var(--u)) calc(54 * var(--u)) 0 calc(116 * var(--u)); overflow: hidden; }
  .pad[data-mode=text] canvas.ink { pointer-events: none; }
  .pad[data-mode=draw] textarea { pointer-events: none; }
  .pad[data-mode=draw] canvas.ink { cursor: crosshair; touch-action: none; }
  .tools { display: flex; gap: 6px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .tools button { border: 1px solid var(--line); background: #fff; border-radius: 9px; padding: 6px 10px; font-weight: 700; }
  .tools button.on { background: var(--ink); color: #fff; }
  .tools .c { width: 26px; height: 26px; padding: 0; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line); }
  .tools .c.on { box-shadow: 0 0 0 2px var(--ink); }
  .modal .row { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
  .modal select { font: inherit; padding: 8px; border-radius: 8px; border: 1px solid var(--line); }
  .modal .row button { margin-left: auto; border: 0; border-radius: 10px; padding: 10px 16px; background: var(--rose); color: #fff; font-weight: 800; }

  /* ---- рабочий стол на экране ноутбука ---- */
  #desktop { position: fixed; inset: 0; overflow: hidden; opacity: 0; transition: opacity .5s;
    background: radial-gradient(circle at 20% 15%, #ffd7c2 0, transparent 45%), radial-gradient(circle at 85% 80%, #f6b3c8 0, transparent 50%), linear-gradient(160deg, #fbe3d4, #f3c7d3 60%, #d9b6dd);
    background-size: cover; background-position: center; }
  #desktop.on { opacity: 1; }
  #desktop[hidden] { display: none; }
  .menubar { height: 30px; display: flex; align-items: center; gap: 18px; padding: 0 14px; background: rgba(255,255,255,.45); backdrop-filter: blur(14px); font-size: 14px; font-weight: 600; }
  .menubar .grow { flex: 1; }
  .hello { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; font-family: Caveat, cursive; pointer-events: none; }
  .hello b { font-size: clamp(48px, 9vw, 110px); color: #c2557a; font-weight: 700; }
  .hello span { font-size: clamp(22px, 3.4vw, 40px); }
  .icons { position: absolute; top: 50px; right: 20px; display: grid; grid-template-columns: repeat(2, auto); gap: 14px; }
  .icon { width: 86px; border: 0; background: none; display: grid; justify-items: center; gap: 4px; padding: 6px; border-radius: 10px; font-size: 13px; font-weight: 700; text-shadow: 0 1px 2px rgba(255,255,255,.7); }
  .icon:hover, .icon:focus-visible { background: rgba(255,255,255,.35); outline: none; }
  .icon i { font-style: normal; font-size: 40px; filter: drop-shadow(0 4px 6px rgba(0,0,0,.15)); }
  .dock { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; gap: 6px; padding: 8px 10px; background: rgba(255,255,255,.4); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.55); border-radius: 20px; }
  .dock button { width: 52px; height: 52px; border: 0; border-radius: 14px; background: rgba(255,255,255,.6); font-size: 28px; transition: transform .15s; }
  .dock button:hover { transform: translateY(-8px) scale(1.15); }

  .win { position: absolute; width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 130px); display: flex; flex-direction: column; background: var(--glass); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,.7); border-radius: 14px; box-shadow: 0 24px 70px rgba(60, 20, 40, .3); animation: pop .25s ease-out; }
  @keyframes pop { from { transform: scale(.92); opacity: 0; } }
  .bar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; cursor: grab; user-select: none; touch-action: none; border-bottom: 1px solid var(--line); }
  .bar b { flex: 1; text-align: center; font-size: 13px; margin-right: 44px; }
  .dot { width: 13px; height: 13px; border-radius: 50%; border: 0; padding: 0; background: #ddd; }
  .dot.r { background: #ff5f57; } .dot.y { background: #febc2e; } .dot.g { background: #28c840; }
  .body { padding: 16px; overflow: auto; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  .polaroid { background: #fff; padding: 8px 8px 30px; box-shadow: 0 6px 16px rgba(0,0,0,.12); transform: rotate(var(--r)); position: relative; }
  .polaroid img, .polaroid .ph { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: linear-gradient(135deg, #fde2d4, #f6c1d0); }
  .polaroid span { position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; font-family: Caveat, cursive; font-size: 20px; }
  .empty { font-family: Caveat, cursive; font-size: 22px; opacity: .7; }

  .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .list label { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; background: rgba(255,255,255,.6); }
  .list input:checked + span { text-decoration: line-through; opacity: .5; }
  .add { display: flex; gap: 8px; margin-top: 12px; }
  .add input, .add textarea { flex: 1; font: inherit; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: #fff; }
  .add button { border: 0; border-radius: 10px; padding: 0 16px; background: var(--rose); color: #fff; font-weight: 800; }

  .thought { background: #fff8c9; padding: 12px 14px 10px; border-radius: 4px 4px 14px 4px; box-shadow: 0 4px 12px rgba(0,0,0,.08); margin-bottom: 10px; }
  .thought p { margin: 0 0 6px; font-family: Caveat, cursive; font-size: 24px; line-height: 1.15; }
  .thought small { opacity: .55; }

  .counter { text-align: center; }
  .counter .big { font-family: Caveat, cursive; font-size: clamp(64px, 14vw, 110px); line-height: 1; color: var(--rose); }
  .counter .parts { display: flex; justify-content: center; gap: 18px; margin: 14px 0; font-weight: 800; }
  .counter .parts small { display: block; font-weight: 400; opacity: .6; }

  .booklabel { position: fixed; transform: translate(-50%, -130%); pointer-events: none; padding: 6px 12px; border-radius: 10px; background: var(--paper); font-family: Caveat, cursive; font-size: 24px; font-weight: 700; box-shadow: 0 6px 20px rgba(0,0,0,.3); white-space: nowrap; transition: opacity .2s; }
  .booklabel[hidden] { display: block; opacity: 0; }
  .zlens { position: fixed; transform: translate(-50%, -50%) rotate(-8deg); border: 0; background: none; padding: 0; cursor: zoom-in; z-index: 5; filter: drop-shadow(0 4px 8px rgba(60,20,40,.35)); animation: zpulse 1.6s ease-in-out infinite; }
  .zlens[hidden] { display: none; }
  @keyframes zpulse { 50% { transform: translate(-50%, -50%) rotate(-8deg) scale(1.12); } }
  .zback { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) rotate(-1.5deg); z-index: 6; padding: 8px 22px; font: 700 26px/1 Caveat, cursive; color: var(--ink); background: var(--paper); border: 2px solid var(--ink); border-radius: 18px 14px 20px 12px; cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
  .zback:hover { transform: translateX(-50%) rotate(1deg) scale(1.05); }
  .zback[hidden] { display: none; }
  body.zoomed .hud, body.zoomed .tip { opacity: 0; pointer-events: none; }
  body.zoomhover #scene { cursor: zoom-in; }

  /* ---- альбом ---- */
  #album { --album: #e7849b; position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px 16px 16px; background: rgba(30, 18, 26, .62); backdrop-filter: blur(6px); opacity: 0; transition: opacity .35s; }
  #album.on { opacity: 1; }
  #album[hidden] { display: none; }
  .album-top { width: 100%; max-width: 1100px; display: flex; align-items: center; gap: 10px; color: #fff; }
  .album-top .album-name { flex: 1; text-align: center; font-family: Caveat, cursive; font-size: 30px; }
  .album-top button, .album-nav button { border: 0; border-radius: 999px; padding: 8px 14px; background: rgba(255,255,255,.9); color: var(--ink); font-weight: 700; }
  .album-tools { width: 100%; max-width: 1100px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 14px; background: var(--paper); }
  .album-tools[hidden] { display: none; }
  .album-tools input[name=title] { font: 700 20px Caveat, cursive; padding: 4px 10px; border: 1px solid var(--line); border-radius: 8px; width: 190px; }
  .album-tools button, .album-tools label { border: 1px solid var(--line); background: #fff; border-radius: 9px; padding: 6px 10px; font-weight: 700; font-size: 14px; cursor: pointer; }
  .album-tools label input { display: none; }
  .album-tools .danger { color: #c43a4f; }
  .swatches { display: flex; gap: 4px; align-items: center; }
  .sw { width: 22px; height: 22px; padding: 0 !important; border-radius: 50% !important; border: 2px solid #fff !important; box-shadow: 0 0 0 1px var(--line); }
  input[name=color] { width: 30px; height: 26px; padding: 0; border: 0; background: none; }
  .spread { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; filter: drop-shadow(0 18px 40px rgba(0,0,0,.45)); }
  .page { container-type: inline-size; position: relative; width: min(44vw, calc((100vh - 190px) * .75)); aspect-ratio: 3 / 4; overflow: hidden; background: #fffaf3 linear-gradient(90deg, rgba(0,0,0,.06), transparent 8%); border-radius: 2px 8px 8px 2px; }
  .page + .page { border-radius: 8px 2px 2px 8px; background: #fffaf3 linear-gradient(270deg, rgba(0,0,0,.06), transparent 8%); }
  .page.cover { background: var(--album) linear-gradient(135deg, rgba(255,255,255,.18), rgba(0,0,0,.12)); display: grid; place-items: center; align-content: center; gap: 6cqw; }
  .editing .page.active { outline: 3px dashed var(--album); outline-offset: -6px; }
  .editing .page { width: min(44vw, calc((100vh - 280px) * .75)); }
  .cover-photo { width: 64cqw; aspect-ratio: 4 / 3; background: #fff; padding: 3cqw; box-shadow: 0 8px 20px rgba(0,0,0,.25); transform: rotate(-2deg); display: grid; place-items: center; font: 700 6cqw Caveat, cursive; color: #b9a7a0; text-align: center; }
  .cover-photo img { width: 100%; height: 100%; object-fit: cover; }
  .cover-title { font: 700 11cqw/1 Caveat, cursive; text-align: center; padding: 0 6cqw; }
  .page-hint { position: absolute; inset: 0; display: grid; place-items: center; font: 600 6cqw Caveat, cursive; color: #c9b5ab; pointer-events: none; }
  .page-num { position: absolute; bottom: 2cqw; left: 0; right: 0; text-align: center; font-size: 3cqw; color: #b9a7a0; }
  .item { position: absolute; transform-origin: center; user-select: none; }
  .item.photo { background: #fff; padding: 1.6cqw 1.6cqw 5cqw; box-shadow: 0 4px 12px rgba(0,0,0,.18); }
  .item.photo img { display: block; width: 100%; pointer-events: none; }
  .item.text { font-family: Caveat, cursive; font-weight: 700; color: #3b2a35; white-space: pre-wrap; max-width: 90cqw; line-height: 1.05; }
  .item .txt[contenteditable=true] { outline: 2px dashed var(--album); cursor: text; user-select: text; }
  .editing .item { cursor: move; touch-action: none; }
  .editing .item:hover, .item.sel { outline: 2px dashed rgba(59,42,53,.45); outline-offset: 2px; }
  .hd { position: absolute; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.3); display: none; place-items: center; font-size: 12px; touch-action: none; }
  .item.sel .hd, .editing .item:hover .hd { display: grid; }
  .hd.del { top: -11px; right: -11px; cursor: pointer; } .hd.del::after { content: '✕'; color: #c43a4f; }
  .hd.size { bottom: -11px; right: -11px; cursor: nwse-resize; } .hd.size::after { content: '⤡'; }
  .hd.rot { top: -11px; left: -11px; cursor: grab; } .hd.rot::after { content: '⟳'; }
  .album-nav { display: flex; align-items: center; gap: 14px; color: #fff; font-weight: 700; }
  .album-nav button:disabled { opacity: .35; }


  /* ---- пароль, фото на стене, листание стопки ---- */
  #gate, #wallModal { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(20, 12, 18, .6); backdrop-filter: blur(6px); z-index: 50; }
  #gate[hidden], #wallModal[hidden] { display: none; }
  #gate form, .wbox { width: min(380px, calc(100vw - 32px)); background: var(--paper); border-radius: 18px; padding: 22px; box-shadow: 0 20px 60px rgba(0,0,0,.4); text-align: center; }
  #gate h3, .wbox h3 { margin: 0 0 6px; font: 700 32px Caveat, cursive; }
  #gate p { margin: 0 0 14px; opacity: .7; font-size: 14px; }
  #gate input, .wbox input[name=caption] { width: 100%; font: inherit; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line); background: #fff; }
  #gate button, .wbox button, .wbox label { margin-top: 12px; border: 0; border-radius: 12px; padding: 10px 16px; background: var(--rose); color: #fff; font-weight: 800; cursor: pointer; display: inline-block; }
  #gate .err { color: #c43a4f; font-size: 14px; margin: 8px 0 0; }
  #gate form > * + input, #gate .seg, #gate .lbl { margin-top: 10px; }
  #gate .hint { font-size: 14px; }
  #gate .ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); margin-left: 6px; }
  #gate .seg { display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: rgba(59,42,53,.06); }
  #gate .seg button { flex: 1; margin: 0; padding: 8px; background: transparent; color: var(--ink); font-weight: 700; }
  #gate .seg button.on { background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  #gate .lbl { display: flex; align-items: center; gap: 10px; font-size: 14px; text-align: left; }
  #gate .lbl input { flex: 1; }
  #gate [hidden] { display: none !important; }
  .wbox .ph { margin: 10px auto; width: 220px; background: #fff; padding: 10px 10px 34px; box-shadow: 0 8px 22px rgba(0,0,0,.18); transform: rotate(-2deg); }
  .wbox .ph img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
  .wbox .ph .empty { aspect-ratio: 1; display: grid; place-items: center; background: linear-gradient(135deg, #fde2d4, #f6c1d0); color: #a5687b; font: 700 24px Caveat, cursive; }
  .wbox label input { display: none; }
  .wbox .ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  .wbox .status { display: block; min-height: 18px; font-size: 13px; opacity: .7; margin-top: 6px; }
  #noteNav { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; z-index: 5; }
  #noteNav[hidden] { display: none; }
  #noteNav button { width: 46px; height: 46px; border: 0; border-radius: 50%; background: var(--glass); font-size: 24px; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  #noteNav span { font: 700 22px Caveat, cursive; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.5); }

  /* ---- широкие окна ноутбука ---- */
  .win.wide { width: min(940px, calc(100vw - 32px)); height: min(640px, calc(100vh - 120px)); background: rgba(255, 250, 246, .97); }
  .win.wide .body { flex: 1; position: relative; }
  .win.xl { width: min(1180px, calc(100vw - 32px)); height: min(720px, calc(100vh - 110px)); }
  .toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 90; padding: 10px 18px; border-radius: 999px; background: var(--ink); color: #fff; font-weight: 800; box-shadow: 0 10px 30px rgba(0,0,0,.3); animation: pop .25s ease-out; transition: opacity .5s, transform .5s; pointer-events: none; }
  /* ---- магазин и профиль ---- */
  .shophead { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px 16px 6px; }
  .sbal { display: grid; margin-right: auto; }
  .sbal b { font: 700 38px/1 Caveat, cursive; color: var(--rose); }
  .sbal span { font-size: 13px; opacity: .65; }
  .stabs { display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: rgba(59,42,53,.06); }
  .stabs button { border: 0; background: transparent; border-radius: 9px; padding: 8px 12px; font-weight: 700; cursor: pointer; }
  .stabs button.on { background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
